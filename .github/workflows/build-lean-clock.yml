name: Build Lean Radar + Clock

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin PlatformIO toolchain
        run: |
          echo 'platformio==6.1.19' > "$RUNNER_TEMP/pio-constraints.txt"
          echo 'pioarduino==6.1.19' >> "$RUNNER_TEMP/pio-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/pio-constraints.txt" >> "$GITHUB_ENV"
          echo "UV_CONSTRAINT=$RUNNER_TEMP/pio-constraints.txt" >> "$GITHUB_ENV"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build ESP8266 Lean firmware
        run: pio run -e smalltv_lean
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-lean-radar-clock
          path: .pio/build/smalltv_lean/firmware.bin
          if-no-files-found: error
